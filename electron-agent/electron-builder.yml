appId: com.rxstudio.grenagent
productName: GrenAgent
directories:
  output: release
files:
  - dist/**
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@colbymchenry/**
afterPack: ./scripts/package-codegraph.cjs
extraResources:
  - from: resources/pi
    to: pi
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
