appId: com.rxstudio.grenagent
productName: GrenAgent
directories:
  output: release
files:
  - dist/**
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@colbymchenry/**
  - node_modules/@ast-grep/**
  - out/main/pi-worker.js
  - out/main/chunks/**
  - out/main/runner.py
  - out/main/runner.mjs
  - out/main/prompts/**
afterPack: ./scripts/package-codegraph.cjs
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
