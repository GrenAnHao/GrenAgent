allowBuilds:
  '@google/genai': true
  '@homebridge/node-pty-prebuilt-multiarch': true
  '@lobehub/editor': true
  '@vscode/ripgrep': true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.87.0 || 1.0.2 || 1.1.0 || 1.3.0'
  - '@earendil-works/pi-ai@0.87.0 || 1.0.2 || 1.1.0 || 1.3.0'
  - '@earendil-works/pi-coding-agent@0.87.0 || 1.0.2 || 1.1.0 || 1.3.0'
  - '@earendil-works/pi-telemetry@0.87.0 || 1.0.2 || 1.1.0 || 1.3.0'
  - '@earendil-works/pi-tui@0.87.0 || 1.0.2 || 1.1.0 || 1.3.0'
  # codegraph 的预编译平台二进制：pnpm 不为外平台 optionalDependencies 取 manifest，
  # 拿不到发布时间就一律判为不可校验，本机永远过不了这道检查。父包
  # @colbymchenry/codegraph 不在此列，仍受 minimumReleaseAge 约束。
  - '@colbymchenry/codegraph-*'
  - '@earendil-works/pi-codemode@1.0.2 || 1.1.0 || 1.3.0'
  - '@earendil-works/pi-mcp@1.0.2 || 1.1.0 || 1.3.0'

# credential-provider-sso asks for 3.1129.0, which is not on npm.
overrides:
  '@aws-sdk/token-providers': 3.1048.0
