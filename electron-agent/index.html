<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrenAgent</title>
    <link rel="icon" href="./favicon.ico" />
    <script>
      // 首帧前按「设置 → 外观」定首屏明暗，写到 <html data-theme>，React 起来后 ThemeBridge 写的也是这个属性。
      // 读 themeStore 的持久化值（zustand persist，键 pi-theme），判定与 App 的 isDark 相同；
      // 没存过或解析失败时用 themeStore 的默认值 dark。
      (() => {
        let appearance = 'dark';
        try {
          appearance = JSON.parse(localStorage.getItem('pi-theme'))?.state?.appearance ?? appearance;
        } catch {}
        const dark =
          appearance === 'dark' || (appearance === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* 首屏配色：深色沿用原品牌页的兜底色；浅色取默认 github 浅色方案的 token（与 ThemeBridge 写入值一致）。 */
      html {
        --boot-bg: #0b0d12;
        --boot-logo: #4c8bf5;
        --boot-fg: #e6e8ec;
        --boot-muted: #9aa1ac;
      }
      html[data-theme='light'] {
        --boot-bg: #ffffff;
        --boot-logo: #0072f5;
        --boot-fg: #1f2328;
        --boot-muted: #59636e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
      }
      /* 冷启动唯一的加载页：首帧即显示 GrenAgent 字标的描边动画，一直撑到首个对话就绪。
         放在 #root 之外，React 挂载时不会被替换，动画不会中途重播；由 src/lib/bootSplash.ts 淡出并移除。
         颜色只按明暗取上面的固定值：--gren-* 要等 React 挂载后才写入，绑定它们会让加载页中途变色。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--boot-bg);
        /* 窗口无边框：加载期整屏都是拖拽区。 */
        -webkit-app-region: drag;
        /* 时长与 src/lib/bootSplash.ts 的 FADE_MS 一致。 */
        transition: opacity 0.45s ease;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      #boot-splash svg {
        display: block;
        color: var(--boot-logo);
      }
      /* 与 @lobehub/ui BrandLoading 的描边动画一致（stroke-width 0.25em × 14px）。 */
      #boot-splash path {
        fill: currentColor;
        fill-opacity: 0;
        stroke: currentColor;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        stroke-width: 3.5px;
        animation:
          boot-splash-draw 2s cubic-bezier(0.4, 0, 0.2, 1) infinite,
          boot-splash-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #boot-splash .name {
        font: 500 14px/24px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial,
          sans-serif;
        letter-spacing: 5px;
        color: var(--boot-muted);
      }
      #boot-splash .name span {
        color: var(--boot-fg);
      }
      @keyframes boot-splash-draw {
        from {
          stroke-dashoffset: 1000;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-splash-fill {
        30% {
          fill-opacity: 0.05;
        }
        to {
          fill-opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" role="status" aria-label="GrenAgent 正在启动">
      <svg width="96" height="88" viewBox="0 0 240 220" fill-rule="evenodd" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 56 H200 V84 H40 Z M74 84 H102 V190 H74 Z M150 84 H178 V190 H150 Z" />
      </svg>
      <div class="name">GREN<span>AGENT</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
