<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrenAgent</title>
    <link rel="icon" href="./favicon.ico" />
    <script>
      // 首帧前按「设置 → 外观」定首屏明暗，写到 <html data-theme>，React 起来后 ThemeBridge 写的也是这个属性。
      // 读 themeStore 的持久化值（zustand persist，键 pi-theme），判定与 WorkbenchThemeProvider 相同；
      // 没存过或解析失败时用 themeStore 的默认值 dark。
      (() => {
        let appearance = 'dark';
        try {
          appearance = JSON.parse(localStorage.getItem('pi-theme'))?.state?.appearance ?? appearance;
        } catch {}
        const dark =
          appearance === 'dark' || (appearance === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* 首屏配色对齐 theme/workbenchTheme 的固定工作台颜色，React 挂载前也不套用旧方案。 */
      html {
        --boot-bg: #222325;
        --boot-logo: #e8e8e2;
      }
      html[data-theme='light'] {
        --boot-bg: #f3f3f0;
        --boot-logo: #242722;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
      }
      /* 冷启动唯一的加载页：首帧即显示原稿路径字标，一直撑到首个对话就绪。
         放在 #root 之外，React 挂载时不会被替换，动画不会中途重播；由 src/lib/bootSplash.ts 淡出并移除。
         颜色只按明暗取上面的固定值：--gren-* 要等 React 挂载后才写入，绑定它们会让加载页中途变色。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--boot-bg);
        /* 窗口无边框：加载期整屏都是拖拽区。 */
        -webkit-app-region: drag;
        /* 时长与 src/lib/bootSplash.ts 的 FADE_MS 一致。 */
        transition: opacity 0.45s ease;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      #boot-splash svg {
        display: block;
        color: var(--boot-logo);
        width: min(272px, 72vw);
        height: auto;
        animation: boot-splash-pulse 1.6s ease-in-out infinite alternate;
      }
      @keyframes boot-splash-pulse {
        from {
          opacity: 0.65;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
