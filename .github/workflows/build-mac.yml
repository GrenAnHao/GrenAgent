name: Build macOS

# macOS runner 按 10 倍分钟计费（私有仓库），所以只手动触发或打 v* 标签时才跑，
# 手动触发时可以只选一种架构。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "构建架构"
        type: choice
        default: arm64
        options:
          - arm64
          - x64
          - both
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          arch="${{ github.event.inputs.arch || 'both' }}"
          arm='{"arch":"arm64","runner":"macos-latest"}'
          x64='{"arch":"x64","runner":"macos-15-intel"}'
          case "$arch" in
            arm64) m="[$arm]" ;;
            x64)   m="[$x64]" ;;
            *)     m="[$arm,$x64]" ;;
          esac
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 三个子项目各自维护依赖和锁文件，electron-agent 的构建会解析 ../extensions 与 ../cli 的 node_modules。
      # allowBuilds 等设置需要 pnpm 11 以上。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install extensions
        working-directory: extensions
        run: pnpm install --frozen-lockfile

      - name: Install cli
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Install electron-agent
        working-directory: electron-agent
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: electron-agent
        run: pnpm build

      - name: Package dmg
        working-directory: electron-agent
        run: pnpm exec electron-builder --config electron-builder.yml --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: GrenAgent-mac-${{ matrix.arch }}
          path: electron-agent/release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: electron-agent/release/*.dmg
